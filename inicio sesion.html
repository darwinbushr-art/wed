<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión | Restaurante Gusto - Perú</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="contenedor">
    <div class="login">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ986OT98Cdcx3BGbHYvmhvFdo6ggxStiRLWQ&s" alt="Logo Restaurante Gusto Perú" class="logo">
        <h1>Restaurante Gusto - Perú</h1>
        <h2>Bienvenido</h2>
        <p>Inicia sesión para acceder al sistema del restaurante.</p>

        <form action="inicio.html" method="get">
            <label>Usuario</label>
            <input type="text" placeholder="Ingrese su usuario" required>

            <label>Contraseña</label>
            <input type="password" placeholder="Ingrese su contraseña" required>

            <div class="opciones">
                <label>
                    <input type="checkbox"> Recordarme
                </label>
                <a href="#">¿Olvidó su contraseña?</a>
            </div>

            <button type="submit">Iniciar Sesión</button>
        </form>

        <div class="registro">
            <p>¿No tienes una cuenta? <a href="#">Registrarse</a></p>
        </div>
    </div>
</div>

</body>
</html>
